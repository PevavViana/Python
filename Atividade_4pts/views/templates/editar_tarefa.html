{% extends "base.html" %}
{% block title %}Editar tarefa{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4"><i class="bi bi-pencil-square"></i> Editar tarefa</h2>
        {% if erro %}
            <div class="alert alert-danger">{{ erro }}</div>
        {% endif %}
        <form method="post">
            <div class="mb-3">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" class="form-control" id="titulo" name="titulo" value="{{ tarefa.titulo }}" required autofocus>
            </div>
            <div class="mb-3">
                <label for="descricao" class="form-label">Descrição</label>
                <textarea class="form-control" id="descricao" name="descricao" rows="3">{{ tarefa.descricao }}</textarea>
            </div>
            <div class="mb-3">
                <label for="status" class="form-label">Status</label>
                <select class="form-select" id="status" name="status">
                    {% for s in status_validos %}
                        <option value="{{ s }}" {% if s == tarefa.status %}selected{% endif %}>
                            {{ s.replace('_', ' ') | capitalize }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar alterações</button>
            <a href="{{ url_for('tarefas.dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
