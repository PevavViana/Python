<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Painel de Tarefas{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% if session.usuario_id %}{{ url_for('tarefas.dashboard') }}{% else %}{{ url_for('auth.login') }}{% endif %}">
            <i class="bi bi-check2-square"></i> Painel de Tarefas
        </a>
        <div class="d-flex align-items-center gap-2">
            {% if session.usuario_id %}
                <span class="navbar-text text-light me-2">
                    <i class="bi bi-person-circle"></i> {{ session.usuario_nome }}
                </span>
                <a class="btn btn-outline-light btn-sm" href="{{ url_for('tarefas.progresso') }}">
                    <i class="bi bi-bar-chart-line"></i> Progresso
                </a>
                <a class="btn btn-outline-light btn-sm" href="{{ url_for('auth.logout') }}">
                    <i class="bi bi-box-arrow-right"></i> Sair
                </a>
            {% endif %}
            <button id="btn-modo-escuro" class="btn btn-outline-light btn-sm" type="button" title="Alternar modo escuro">
                <i class="bi bi-moon-stars"></i>
            </button>
        </div>
    </div>
</nav>

<main class="container pb-5">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Item 9: modo escuro persistido em localStorage.
    const HTML = document.documentElement;
    const BOTAO = document.getElementById('btn-modo-escuro');

    function aplicarModo(modo) {
        if (modo === 'escuro') {
            document.body.classList.add('bg-dark', 'text-light');
            BOTAO.innerHTML = '<i class="bi bi-sun"></i>';
        } else {
            document.body.classList.remove('bg-dark', 'text-light');
            BOTAO.innerHTML = '<i class="bi bi-moon-stars"></i>';
        }
    }

    const modoSalvo = localStorage.getItem('modo') || 'claro';
    aplicarModo(modoSalvo);

    BOTAO.addEventListener('click', () => {
        const atual = localStorage.getItem('modo') || 'claro';
        const novo = atual === 'claro' ? 'escuro' : 'claro';
        localStorage.setItem('modo', novo);
        aplicarModo(novo);
    });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
