{% extends "base.html" %}
{% block title %}Progresso{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-bar-chart-line"></i> Progresso das tarefas</h2>
<div class="row justify-content-center">
    <div class="col-md-6">
        <canvas id="grafico-progresso"></canvas>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
    // Item 10: dados vêm de uma rota Flask que retorna JSON (/api/progresso).
    fetch('/api/progresso')
        .then((r) => r.json())
        .then((dados) => {
            const rotulos = Object.keys(dados).map((s) => s.replace('_', ' '));
            const valores = Object.values(dados);

            new Chart(document.getElementById('grafico-progresso'), {
                type: 'pie',
                data: {
                    labels: rotulos,
                    datasets: [{
                        data: valores,
                        backgroundColor: ['#ffc107', '#0d6efd', '#198754'],
                    }],
                },
                options: { plugins: { legend: { position: 'bottom' } } },
            });
        });
</script>
{% endblock %}
